<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { padding: 8px 10px 0 10px; background: transparent; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
    .tab-container {
      width: 100%;
      border-bottom: 2.5px solid #3A4B5C;
      display: flex;
      align-items: flex-end;
    }
    .world-tab {
      background-color: #3A4B5C;
      color: #FFFFFF;
      padding: 9px 22px;    /* 11px 26px → 살짝 줄임 */
      border-radius: 5px 5px 0 0;
      font-size: 16px;      /* 13px → 글자 키움 */
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
  </style>
</head>
<body>
  <div class="tab-container">
    <div class="world-tab">🌐 세계관</div>
  </div>
</body>
</html>
