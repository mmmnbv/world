<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { padding: 8px 10px 0 10px; background: transparent; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
    .tab-container {
      width: 100%;
      border-bottom: 2.5px solid #3A4B5C; /* 요청하신 푸른 계열 저채도/저명도 색상 */
      display: flex;
      align-items: flex-end;
    }
    .world-tab {
      background-color: #3A4B5C;
      color: #FFFFFF;
      padding: 6px 14px;
      border-radius: 4px 4px 0 0;
      font-size: 13px;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>
  <div class="tab-container">
    <div class="world-tab">🌐 세계관</div>
  </div>
</body>
</html>
